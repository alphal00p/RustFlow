[package]
name = "rustred-python"
version.workspace = true
authors.workspace = true
edition = "2024"
rust-version = "1.89"
description = "Python adapter for the RustRed application API"
license = "MIT"
publish = false

[lib]
name = "_rustred"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
capacity-dispatch = ["rustred-app/capacity-dispatch"]
runtime-arity-selection = ["rustred-app/runtime-arity-selection"]
default = ["native", "standalone", "reconstruction"]
native = ["rustred-app/native"]
wasm = ["rustred-app/wasm"]
# Embedded HEPKit shares its host's Python ABI and Symbolica feature selection.
standalone = ["pyo3/abi3-py311"]
reconstruction = ["rustred-app/reconstruction"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.28" }
rustred-app = { path = "../rustred-app", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
