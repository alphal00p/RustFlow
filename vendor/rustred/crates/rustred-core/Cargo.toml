[package]
name = "rustred"
version.workspace = true
authors.workspace = true
edition = "2024"
rust-version = "1.89"
description = "Pure-Rust, Symbolica-native parametric IBP tools"
license = "MIT"

[lib]
name = "rustred"
path = "src/lib.rs"

[features]
# Experimental reconstruction needs the newer vendored Symbolica API. Exact
# sparse IBP solving can also be embedded in hosts using released Symbolica 3.
default = ["native", "reconstruction"]
native = ["symbolica/integer-gmp", "symbolica/float-mpfr"]
# Symbolica supplies its pure-Rust Malachite/Astro implementation; RustRed
# does not implement another numerical or computer-algebra backend.
wasm = ["symbolica/wasm"]
reconstruction = []
# Optional shared inline storage for smaller physical families.
capacity-dispatch = []
# Explicit permission to restrict/extend the runtime arity registry at build time.
runtime-arity-selection = []

[dependencies]
bincode.workspace = true
blake3 = "1"
rand = "0.9"
rayon = "1"
rustred-order = { path = "../rustred-order" }
symbolica.workspace = true

[[example]]
name = "spired-solve-case"
path = "../../examples/rust/spired_solve_case.rs"

[[example]]
name = "spired-solve-sector"
path = "../../examples/rust/spired_solve_sector.rs"

[[example]]
name = "spired-artifact-audit"
path = "../../examples/rust/spired_artifact_audit.rs"

[[example]]
name = "spired-generate-k6"
path = "../../examples/rust/spired_generate_k6.rs"

[[example]]
name = "spired-generate-four-loop-h"
path = "../../examples/rust/spired_generate_four_loop_h.rs"

[[example]]
name = "wv-family-automorphisms"
path = "../../tools/research/wv/family_automorphisms.rs"
