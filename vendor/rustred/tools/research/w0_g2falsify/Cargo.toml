[package]
name = "w0_g2falsify"
version = "0.1.0"
edition = "2021"
description = "W0 G2' falsifier tools (throwaway, read-only): walk record statistics with residual-anchor accounting"

# Standalone: not a member of the rustred workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
