# Pure RustRed K=6 search with externally reviewed search chronology.
#
# The 55 rectangles below contain only integral anchors and their unbounded
# coordinate axes. RustRed canonicalizes and deduplicates them, regenerates
# all nine ordinary K=6 IBP rows, and retains sole authority for replay,
# descent, coverage, terminals, and artifact publication.
schema = "rustred.foundry-campaign-config.toml.v2"
preset = "three-loop-unit-mass-vacuum-k6-orbit-0"
mode = "external-hints-only"
max_task_reports = 4096
max_reported_uncovered_boxes = 4096

[hints]
itinerary = "full-rank-atomic-waves"
interior_margin = 2
polynomial_degree_ceiling = 0
ordering_policy = "rustred.unshifted-sector-order.v1;priority=rustred.coordinate-priority.v1;k=6;rank-by-slot=5,3,4,2,0,1"
discovery_coordinate_priority = [5, 3, 4, 2, 0, 1]

