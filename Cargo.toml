[package]
name = "symbolica-amflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Symbolica-native auxiliary mass flow for dimensionally regulated Feynman integrals"
license = "MIT"

[dependencies]
symbolica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "75f8350094b90254ee71dc2a391fde0d14b0204a", default-features = false, features = ["integer-gmp", "float-mpfr", "bincode", "serde", "tracing_max_level_info"] }
rustred = { path = "../rustred/crates/rustred-core", default-features = false }
rug = { version = "1.28", default-features = false, features = ["float", "integer", "rational"] }
rayon = "1.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ahash = "0.8"
bincode = { version = "2.0.1", features = ["serde"] }

[build-dependencies]
blake3 = "1"

# Keep RustRed and Symbolica's companion crates on the same upstream revision.
[patch.crates-io]
symbolica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "75f8350094b90254ee71dc2a391fde0d14b0204a" }
numerica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "75f8350094b90254ee71dc2a391fde0d14b0204a" }
graphica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "75f8350094b90254ee71dc2a391fde0d14b0204a" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
