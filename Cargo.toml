[package]
name = "symbolica-amflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "RustFlow: Symbolica-native auxiliary mass flow and physical kinematic transport"
license = "MIT"

[features]
default = ["native", "automatic"]
native = ["symbolica/integer-gmp", "symbolica/float-mpfr", "dep:rug", "rustred?/native", "feynkit-amplitude/native", "feynkit-generator/native", "feynkit-py?/native"]
automatic = ["dep:rustred", "dep:rayon"]
# Opt-in solver storage policy; defaults retain exact arity dispatch.
capacity-dispatch = ["rustred?/capacity-dispatch"]
runtime-arity-selection = ["rustred?/runtime-arity-selection"]
wasm = ["symbolica/wasm", "rustred?/wasm", "feynkit-amplitude/wasm", "feynkit-generator/wasm", "feynkit-py?/wasm"]
python_api = ["dep:pyo3", "dep:feynkit-py", "symbolica/python_export"]
# Preserve the existing full native Python feature and add a browser entry.
python = ["python_api", "native", "automatic"]
python_wasm = ["python_api", "wasm", "automatic"]
python_stubgen = ["python", "dep:pyo3-stub-gen", "symbolica/python_stubgen", "feynkit-py/python_stubgen"]

[[bin]]
name = "rustflow"
path = "src/bin/rustflow.rs"
required-features = ["automatic"]

[dependencies]
symbolica = { version = "=3.0.1", default-features = false, features = ["bincode", "serde", "tracing_max_level_info"] }
rustred = { git = "https://github.com/alphal00p/rustred", rev = "b209adb1e774242bcbe0417fed223317566561bd", default-features = false, optional = true }
rug = { version = "1.28", default-features = false, features = ["float", "integer", "rational"], optional = true }
rayon = { version = "1.11", optional = true }
thiserror = "2"
stacker = "0.1.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ahash = "0.8"
bincode = { version = "2.0.1", features = ["serde"] }

# Match the host source identities; Cargo.lock pins standalone builds.
# Required owner-level HEPKit fixes: docs/hepkit-integration.md.
feynkit-amplitude = { git = "https://github.com/alphal00p/gammaloop", rev = "ea50b6ae9c8e0dc07d2ebc4df2055c87982dc6f3", default-features = false }
feynkit-generator = { git = "https://github.com/alphal00p/gammaloop", rev = "ea50b6ae9c8e0dc07d2ebc4df2055c87982dc6f3", default-features = false }
feynkit-graph = { git = "https://github.com/alphal00p/gammaloop", rev = "ea50b6ae9c8e0dc07d2ebc4df2055c87982dc6f3", default-features = false }
feynkit-model = { git = "https://github.com/alphal00p/gammaloop", rev = "ea50b6ae9c8e0dc07d2ebc4df2055c87982dc6f3", default-features = false }
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop", rev = "ea50b6ae9c8e0dc07d2ebc4df2055c87982dc6f3", default-features = false }
feynkit-tensor = { git = "https://github.com/alphal00p/gammaloop", rev = "ea50b6ae9c8e0dc07d2ebc4df2055c87982dc6f3", default-features = false }
linnet = { git = "https://github.com/alphal00p/gammaloop", rev = "ea50b6ae9c8e0dc07d2ebc4df2055c87982dc6f3", default-features = false, features = ["serde", "bincode", "nodestore-vec"] }
spenso = { git = "https://github.com/alphal00p/gammaloop", rev = "ea50b6ae9c8e0dc07d2ebc4df2055c87982dc6f3", default-features = false, features = ["shadowing"] }
idenso = { git = "https://github.com/alphal00p/gammaloop", rev = "ea50b6ae9c8e0dc07d2ebc4df2055c87982dc6f3", default-features = false }

pyo3 = { version = "0.28", optional = true, features = ["multiple-pymethods"] }
feynkit-py = { git = "https://github.com/alphal00p/gammaloop", rev = "ea50b6ae9c8e0dc07d2ebc4df2055c87982dc6f3", optional = true, default-features = false }
pyo3-stub-gen = { version = "0.17", optional = true, default-features = false, features = ["infer_signature"] }

[build-dependencies]
blake3 = "1"
serde_json = "1"

# Standalone default; an embedding workspace owns its own patch table.
# Share the official kernel cohort with the embedding host.
[patch.crates-io]
# Match the shared owner's official standalone-WASM-capable solver.
clarabel = { git = "https://github.com/oxfordcontrol/Clarabel.rs", rev = "14ad0f09073224e11ce13633d655547001072059" }
# The native HEPKit renderer uses its maintained lean Typst components.
typst-library = { git = "https://github.com/alphal00p/gammaloop", rev = "9ce69d95ac52586426a23ef7cb6b791c09e4e4f0" }
typst-svg = { git = "https://github.com/alphal00p/gammaloop", rev = "9ce69d95ac52586426a23ef7cb6b791c09e4e4f0" }
symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "9cd57678d8817ec33c05cacba4925162f1c86b0b" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", rev = "9cd57678d8817ec33c05cacba4925162f1c86b0b" }
graphica = { git = "https://github.com/symbolica-dev/symbolica", rev = "9cd57678d8817ec33c05cacba4925162f1c86b0b" }

symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
