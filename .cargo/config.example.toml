spynso3 = { path = "/path/to/patched-hepkit/crates/spynso3" }
symbolica-utils = { path = "/path/to/patched-hepkit/crates/symbolica-utils" }
three-dimensional-reps = { path = "/path/to/patched-hepkit/crates/three-dimensional-reps" }
