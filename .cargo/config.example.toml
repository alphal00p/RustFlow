# Copy to config.toml and select the patched native HEPKit owner checkout.
# Symbolica/Numerica/Graphica use the manifest's official community source;
# Cargo.lock selects c3408e4, which includes the exact-division correction.
[patch."https://github.com/alphal00p/gammaloop"]
feynkit-amplitude = { path = "/path/to/patched-hepkit/crates/feynkit-amplitude" }
feynkit-cff = { path = "/path/to/patched-hepkit/crates/feynkit-cff" }
feynkit-generator = { path = "/path/to/patched-hepkit/crates/feynkit-generator" }
feynkit-graph = { path = "/path/to/patched-hepkit/crates/feynkit-graph" }
feynkit-kinematics = { path = "/path/to/patched-hepkit/crates/feynkit-kinematics" }
feynkit-model = { path = "/path/to/patched-hepkit/crates/feynkit-model" }
feynkit-py = { path = "/path/to/patched-hepkit/crates/feynkit-py" }
feynkit-tensor = { path = "/path/to/patched-hepkit/crates/feynkit-tensor" }
feynkit-ufo = { path = "/path/to/patched-hepkit/crates/feynkit-ufo" }
gammaloop-workspace-hack = { path = "/path/to/patched-hepkit/crates/gammaloop-workspace-hack" }
idenso = { path = "/path/to/patched-hepkit/crates/idenso" }
