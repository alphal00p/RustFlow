# OPTIONAL: standalone RustFlow development against a local HEPKit checkout.
# Normal builds use the public owner pin in Cargo.toml; no config copy is needed.
# Start the checkout at a3d1c8a867ac0e89d8f58f9722cf9a7e83338901 and replace all paths.
# Keep this machine-local file out of Git and deliberately update the local lock.
# Do not copy it over a community host's fingerprint configuration: that host
# owns its direct fork dependencies and its separate Vakint pin.
# Symbolica/Numerica/Graphica and RustRed continue to use the manifest and lock.
[patch."https://github.com/alphal00p/gammaloop"]
feynkit-amplitude = { path = "/path/to/native-hepkit/crates/feynkit-amplitude" }
feynkit-cff = { path = "/path/to/native-hepkit/crates/feynkit-cff" }
feynkit-generator = { path = "/path/to/native-hepkit/crates/feynkit-generator" }
feynkit-graph = { path = "/path/to/native-hepkit/crates/feynkit-graph" }
feynkit-kinematics = { path = "/path/to/native-hepkit/crates/feynkit-kinematics" }
feynkit-model = { path = "/path/to/native-hepkit/crates/feynkit-model" }
feynkit-py = { path = "/path/to/native-hepkit/crates/feynkit-py" }
feynkit-tensor = { path = "/path/to/native-hepkit/crates/feynkit-tensor" }
feynkit-ufo = { path = "/path/to/native-hepkit/crates/feynkit-ufo" }
gammaloop-workspace-hack = { path = "/path/to/native-hepkit/crates/gammaloop-workspace-hack" }
idenso = { path = "/path/to/native-hepkit/crates/idenso" }
kurvst = { path = "/path/to/native-hepkit/crates/kurvst" }
linnest = { path = "/path/to/native-hepkit/crates/linnest" }
linnet = { path = "/path/to/native-hepkit/crates/linnet" }
linnet-py = { path = "/path/to/native-hepkit/crates/linnet-py" }
spenso = { path = "/path/to/native-hepkit/crates/spenso" }
spenso-hep-lib = { path = "/path/to/native-hepkit/crates/spenso-hep-lib" }
spenso-macros = { path = "/path/to/native-hepkit/crates/spenso-macros" }
spynso3 = { path = "/path/to/native-hepkit/crates/spynso3" }
symbolica-utils = { path = "/path/to/native-hepkit/crates/symbolica-utils" }
three-dimensional-reps = { path = "/path/to/native-hepkit/crates/three-dimensional-reps" }
typst-renderer = { path = "/path/to/native-hepkit/crates/typst-renderer" }

# Use the same checkout's lean rendering components during local development.
[patch.crates-io]
typst-library = { path = "/path/to/native-hepkit/vendor/typst-library" }
typst-svg = { path = "/path/to/native-hepkit/vendor/typst-svg" }

# Intentionally no Vakint override: its separate implementation is host-owned.
